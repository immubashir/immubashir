<svg width="100%" viewBox="0 0 680 160" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Mubashir — header banner</title>
  <desc>Header banner: hey, i'm mubashir. product engineer · AI/ML · interaction design</desc>
  <style>
    .name { font: 500 38px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111; }
    .tag  { font: 400 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #888; letter-spacing: 0.04em; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{ opacity:0.3 } 50%{ opacity:1 } }
    .slide { animation: slide 2.4s cubic-bezier(0.4,0,0.2,1) forwards; }
    @keyframes slide { from{ opacity:0; transform: translateX(-12px) } to{ opacity:1; transform: translateX(0) } }
    .fadein { animation: fadein 1.8s ease forwards; animation-delay: 0.4s; opacity: 0; }
    @keyframes fadein { to{ opacity:1 } }
    .underline-anim { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 1.2s ease forwards; animation-delay: 0.6s; }
    @keyframes draw { to{ stroke-dashoffset: 0; } }
  </style>
  <rect width="680" height="160" fill="#FAFAFA" rx="12"/>
  <rect x="40" y="60" width="4" height="44" rx="2" fill="#378ADD" class="pulse"/>
  <g class="slide">
    <text x="60" y="95" class="name">hey, i'm mubashir.</text>
  </g>
  <line x1="60" y1="104" x2="280" y2="104" stroke="#378ADD" stroke-width="1.5" fill="none" class="underline-anim"/>
  <g class="fadein">
    <text x="60" y="128" class="tag">product engineer  ·  AI/ML  ·  interaction design</text>
  </g>
  <circle cx="636" cy="40" r="3" fill="#378ADD" class="pulse"/>
  <circle cx="648" cy="52" r="2" fill="#378ADD" class="pulse" style="animation-delay:0.5s"/>
  <circle cx="624" cy="52" r="2" fill="#378ADD" class="pulse" style="animation-delay:1s"/>
</svg>
